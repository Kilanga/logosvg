name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      # `bin/importmap audit` démarre l'application pour lire l'importmap, donc
      # il charge ruby-vips, donc il lui faut libvips — ce que Brakeman et
      # RuboCop, qui analysent le code sans l'exécuter, n'exigent pas. Sans
      # cette étape le travail échoue au chargement, avant d'avoir audité quoi
      # que ce soit, et le message parle d'une bibliothèque partagée là où on
      # cherche une vulnérabilité JavaScript.
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  system-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # Le déploiement, et seulement si tout ce qui précède est passé.
  #
  # Kamal ne se déclenche pas depuis GitHub : il construit l'image ici, la
  # pousse sur ghcr.io, puis ouvre une session SSH vers le serveur pour
  # échanger les conteneurs. Ce travail fait donc exactement ce qu'un
  # `bin/kamal deploy` lancé à la main ferait — à ceci près qu'il ne peut
  # pas partir d'un `main` dont les tests échouent.
  deploy:
    needs: [ scan_ruby, scan_js, lint, test, system-test ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Deux déploiements simultanés se disputeraient le verrou de Kamal. On
    # n'annule pas celui qui tourne : interrompre un déploiement en cours est
    # la meilleure façon de laisser le serveur entre deux versions.
    concurrency:
      group: deploiement-production
      cancel-in-progress: false

    env:
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
      TSHIRT_IA_DATABASE_PASSWORD: ${{ secrets.TSHIRT_IA_DATABASE_PASSWORD }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      GENERATOR_API_KEY: ${{ secrets.GENERATOR_API_KEY }}
      GENERATOR_USER_KEY: ${{ secrets.GENERATOR_USER_KEY }}
      SMTP_USER_NAME: ${{ secrets.SMTP_USER_NAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # L'adresse du serveur est lue dans config/deploy.yml : une seule source
      # de vérité, sinon les deux finissent par diverger sans prévenir.
      #
      # La clé d'hôte est relevée dans un fichier qui n'appartient qu'à nous, et
      # net-ssh est prié de ne consulter que celui-là. Net::SSH refuse la
      # connexion dès qu'il connaît au moins une clé pour l'adresse et qu'aucune
      # ne correspond : une entrée héritée de l'image du runner suffit donc à
      # tout bloquer, même après l'ajout de la bonne clé.
      - name: Autoriser la connexion SSH au serveur
        run: |
          set -uo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # tr -d '\r' par précaution : le secret est collé depuis Windows.
          printf '%s\n' "$CLE_PRIVEE" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # net-ssh écarte en silence une clé qu'il ne peut pas lire et passe à
          # la méthode suivante. Trois défauts se ressemblent alors : clé
          # tronquée, clé protégée par une phrase de passe, ou clé qui n'est pas
          # celle du serveur. On les sépare ici : `ssh-keygen -y` échoue sur les
          # deux premiers (sans terminal, il ne peut pas demander la phrase), et
          # l'empreinte affichée tranche le troisième — elle doit figurer dans
          # ~/.ssh/authorized_keys du VPS.
          journal=$(mktemp)
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub 2> "$journal" < /dev/null; then
            echo "Le secret SSH_PRIVATE_KEY n'est pas une clé privée utilisable ici." >&2
            echo "Clé tronquée, ou protégée par une phrase de passe — le" >&2
            echo "déploiement automatique demande une clé sans phrase." >&2
            cat "$journal" >&2
            exit 1
          fi
          echo "Empreinte de la clé de déploiement :"
          ssh-keygen -lf ~/.ssh/id_ed25519.pub

          hote=$(ruby -ryaml -e 'puts YAML.safe_load_file("config/deploy.yml")["servers"]["web"].first')
          echo "Serveur : $hote"

          # Sans -H : les entrées en clair se comparent par simple égalité de
          # chaîne, le chemin le plus court dans net-ssh. Sans 2>/dev/null : un
          # relevé qui échoue doit faire échouer cette étape-ci, avec son
          # message, plutôt que le déploiement trois minutes plus tard.
          ssh-keyscan -T 10 "$hote" > ~/.ssh/known_hosts_pretatirer
          if [ ! -s ~/.ssh/known_hosts_pretatirer ]; then
            echo "Aucune clé d'hôte relevée sur $hote : déploiement interrompu." >&2
            exit 1
          fi
          echo "Clés d'hôte retenues :"
          ssh-keygen -lf ~/.ssh/known_hosts_pretatirer

          # PreferredAuthentications publickey : net-ssh n'a alors plus aucune
          # méthode de repli. Sans cette ligne, une clé refusée le fait
          # demander un mot de passe à un terminal qui n'existe pas, et
          # l'échec se lit « Errno::ENOTTY » au lieu de « clé refusée ».
          {
            echo "Host $hote"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts_pretatirer"
            echo "  GlobalKnownHostsFile /dev/null"
            echo "  IdentityFile ~/.ssh/id_ed25519"
            echo "  IdentitiesOnly yes"
            echo "  PreferredAuthentications publickey"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config
        env:
          CLE_PRIVEE: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Déployer
        run: bin/kamal deploy

# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

# The technique catalogue is cached for an hour and read from the cache on every
# page. Refreshing slightly more often than it expires means a form is never
# rendered from the bundled fallback just because the refresh was late.
# Scheduled in development too: without it, the local cache would always be cold.
default: &default
  refresh_print_techniques:
    class: RefreshPrintTechniquesJob
    schedule: every 45 minutes
  # Relance les ateliers silencieux et fait expirer les demandes sans réponse.
  # Toutes les heures : les délais se comptent en jours, une heure de retard sur
  # une relance de 48 h ne se voit pas, et le balayage reste peu coûteux.
  sweep_print_requests:
    class: SweepPrintRequestsJob
    schedule: every hour at minute 7
  # Validation automatique, expiration des propositions et graphiste choisi
  # silencieux. Toutes les heures pour la même raison : les délais se comptent
  # en heures ou en jours.
  sweep_reviews:
    class: SweepReviewsJob
    schedule: every hour at minute 22

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

# Mise en ligne de Prêt-à-tirer, avec Kamal.
#
# Trois conteneurs sur une seule machine : l'application, le worker de travaux
# de fond, et PostgreSQL. Le générateur, lui, n'est pas ici — il tourne sur le
# poste à GPU, rejoint par le réseau privé Tailscale (voir GENERATOR_URL).
#
# VPS OVH : vps-7224b00f.vps.ovh.net, 92.222.36.159, utilisateur `ubuntu`.
# Reste à renseigner : GENERATOR_URL, une fois Tailscale posé des deux côtés.
service: pretatirer

# Registre d'images : ghcr.io, gratuit avec un compte GitHub. L'image est
# privée par défaut.
image: kilanga/pretatirer

servers:
  web:
    - 92.222.36.159
  # Le worker a son propre conteneur. Une génération se suit par sondage
  # pendant cinq minutes et télécharge des fichiers : logée dans le serveur
  # web, elle prendrait un des trois fils de Puma pendant tout ce temps, et un
  # redéploiement la tuerait au milieu d'un téléchargement.
  job:
    hosts:
      - 92.222.36.159
    cmd: bin/jobs

# Certificat Let's Encrypt automatique, renouvelé par le proxy.
proxy:
  ssl: true
  host: pretatirer.fr
  app_port: 80

registry:
  server: ghcr.io
  username: Kilanga
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - TSHIRT_IA_DATABASE_PASSWORD
    - GENERATOR_API_KEY
    - GENERATOR_USER_KEY
    - SMTP_USER_NAME
    - SMTP_PASSWORD
    - STRIPE_SECRET_KEY
    - STRIPE_PUBLISHABLE_KEY
    - STRIPE_WEBHOOK_SECRET
    - TURNSTILE_SITE_KEY
    - TURNSTILE_SECRET_KEY
  clear:
    # Le nom servi. Il alimente à la fois les liens des emails et la protection
    # contre la réécriture d'en-tête `Host`.
    APP_HOST: pretatirer.fr

    # La base est un conteneur voisin sur le réseau Docker de Kamal.
    DB_HOST: pretatirer-db

    # Le générateur, sur le poste à GPU, joint par le réseau privé. Jamais une
    # adresse publique : la machine est personnelle et ne doit pas être
    # exposée. L'adresse .ts.net est donnée par RESEAU-PRIVE-TAILSCALE.bat.
    # À remplacer par l'adresse `.ts.net` du poste à GPU, donnée par
    # RESEAU-PRIVE-TAILSCALE.bat. En attendant, cette adresse ne résout pas :
    # l'application répond « service de génération indisponible », ce qu'elle
    # sait faire, et tout le reste du site fonctionne. On peut donc mettre en
    # ligne avant d'avoir posé le réseau privé.
    GENERATOR_URL: http://generateur-a-configurer.invalid:5000

    # Le worker tourne dans son propre conteneur (rôle job) : le superviseur
    # ne doit surtout pas démarrer une seconde fois dans Puma.
    SOLID_QUEUE_IN_PUMA: false

    WEB_CONCURRENCY: 2
    RAILS_MAX_THREADS: 5

# OVH désactive la connexion root par SSH et crée un utilisateur nommé d'après
# la distribution — `ubuntu` ici. Kamal, lui, se connecte en root par défaut :
# sans cette section, le tout premier `kamal setup` échoue sur une
# authentification refusée, et on croit à une clé mal posée.
#
# L'utilisateur doit appartenir au groupe `docker` (voir la checklist) : Kamal
# lance les commandes docker sans sudo.
ssh:
  user: ubuntu

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  jobs: app logs -f -r job
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Les fichiers d'Active Storage : les SVG d'impression, les PNG détourés, les
# aperçus filigranés. Ils survivent aux déploiements, et ils sont ce que la
# sauvegarde nocturne doit emporter avec la base.
volumes:
  - "pretatirer_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  db:
    image: postgres:16
    host: 92.222.36.159
    # Lié à la boucle locale : la base n'est jamais joignable depuis Internet.
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: tshirt_ia
        POSTGRES_DB: tshirt_ia_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

  # Texte écrit dans les métadonnées des fichiers (XMP), lu par les logiciels
  # et non par le client. Voir AiProvenance.
  ai_provenance:
    description: "Image générée par intelligence artificielle avec %{platform}."

  # Libellés partagés par l'écran de création, le suivi et les jobs.
  designs:
    # Deux lignes : le crédit de l'atelier, puis la mention IA. Brûlées dans
    # les pixels de chaque aperçu — un client n'en reçoit jamais d'autre.
    watermark: "Créé avec %{name}"
    watermark_ai: "Image générée par IA"
    ai_label: "Généré par IA"
    ai_label_hint: >-
      Ce visuel a été dessiné par une intelligence artificielle. Les fichiers
      transmis à l'atelier le signalent dans leurs métadonnées.
    family_hint:
      vector: "Couleurs pleines, comptées une à une : chaque couleur est un écran, une découpe ou un fil."
      raster: "Dégradés et photo possibles, imprimés directement en une passe."
    # Ce que la technique a fait de l'image du client, dit en clair à côté
    # d'elle avant qu'il valide (décidé le 10/10/2026).
    changes:
      flattened:
        one: >-
          Redessiné en aplats d'une seule couleur d'encre : les dégradés, les
          ombres et les textures fines deviennent une teinte unie.
        other: >-
          Redessiné en aplats de %{count} couleurs d'encre : les dégradés, les
          ombres et les textures fines deviennent des zones de couleur unie.
      traced: "Les contours sont retracés : les très petits détails et les textes fins peuvent être simplifiés."
      width: "Imprimé sur %{width} cm de large, proportions conservées."
      kept_whole: "Gardé tel quel, couleurs et dégradés compris : rien n'est redessiné."
      raster_size: "Préparé en %{width} × %{height} cm à %{dpi} dpi."
      enlarged: "Agrandi %{factor} fois pour atteindre cette taille : les détails fins seront un peu adoucis."
      background_removed: "Le fond est retiré : la couleur du textile apparaît à la place."
      background_kept: "Le fond est gardé : il sera imprimé lui aussi, rectangle compris."
    facts:
      size: "Taille"
      definition: "Définition"
      resolution: "Résolution"
      sharp_up_to: "Net jusqu'à"
    errors:
      unavailable: "Le service de génération n'est pas joignable. Réessayez dans quelques minutes."
      rate_limited: "Limite de générations atteinte. Réessayez dans %{minutes} min."
      timed_out: "La génération a pris trop de temps. Votre essai ne vous a pas été décompté."
      failed: "La génération a échoué. Votre essai ne vous a pas été décompté."
      expired: "Ce design n'est plus disponible sur la machine de génération."
      unusable_file: "Le fichier produit n'a pas passé nos contrôles. Votre essai ne vous a pas été décompté."

  help:
    # --- Clients : /aide --------------------------------------------------------
    client:
      title: "Aide"
      eyebrow: "Questions fréquentes"
      heading: "Créer son visuel, l'envoyer à l'atelier"
      lead: >-
        Les réponses aux questions que se posent les clients des ateliers. Si
        la vôtre n'y est pas, votre atelier est le mieux placé pour répondre
        sur l'impression ; pour le site, écrivez-nous.
      contact: "Une autre question ?"
      contact_cta: "Nous écrire"
      contact_body: "Sur l'impression, les prix ou les délais : votre atelier. Sur le site : %{support_email}."
      groups:
        - title: "Votre compte et votre atelier"
          questions:
            - q: "Comment créer un compte ?"
              a:
                - >-
                  Par le lien ou le QR code de votre atelier : votre compte lui
                  est rattaché dès sa création. Vous pouvez aussi choisir un
                  atelier dans l'annuaire et lui demander à le rejoindre.
            - q: "Pourquoi mon compte attend-il une réponse ?"
              a:
                - >-
                  Vous êtes passé par l'annuaire, sans le lien de l'atelier :
                  c'est lui qui accepte ses nouveaux clients. Vous recevez un
                  email dès qu'il a répondu. En attendant, vous pouvez vous
                  connecter, mais pas encore créer.
                - "Pour aller plus vite, scannez son affiche ou ouvrez le lien qu'il vous a envoyé : si vous n'avez jamais été son client, vous êtes admis aussitôt."
            - q: "Combien de temps suis-je rattaché à mon atelier ?"
              a:
                - >-
                  %{attachment_days} jours à compter de votre arrivée. Ils
                  repartent de zéro chaque fois que l'atelier confirme l'une de
                  vos demandes d'impression ; il peut aussi les prolonger
                  lui-même. Pendant une vérification par un graphiste, le délai
                  est suspendu, et il repart pour %{attachment_days} jours dès
                  que le graphiste livre. Votre espace vous prévient la
                  dernière semaine.
                - >-
                  Une fois le délai passé, vos visuels restent dans votre
                  espace. Pour créer à nouveau, rescannez l'affiche de
                  l'atelier ou rouvrez son lien : vous lui adressez une
                  demande, et il valide votre retour.
            - q: "Puis-je changer d'atelier ?"
              a:
                - >-
                  Oui. Scannez le QR code du nouvel atelier, ou demandez-lui à
                  le rejoindre depuis l'annuaire. Vous restez chez le premier
                  tant que le second n'a pas accepté.
        - title: "Créer un visuel"
          questions:
            - q: "Combien de visuels puis-je créer ?"
              a:
                - >-
                  %{quota_per_day} créations par jour. Chaque création dessine
                  %{proposals} propositions différentes : vous gardez celle qui
                  vous plaît. Un essai qui échoue ne vous est pas décompté.
            - q: "Comment bien décrire mon idée ?"
              a:
                - >-
                  Décrivez le sujet, pas la technique : « un renard qui fait du
                  skate, style rétro » plutôt que « un dessin vectoriel en trois
                  couleurs ». Le nombre de couleurs et la technique se règlent
                  dans le formulaire.
                - "Un texte à écrire sur le visuel ? Mettez-le entre guillemets : il est reproduit tel quel, sans traduction."
            - q: "Pourquoi dois-je choisir la technique d'impression en premier ?"
              a:
                - >-
                  Parce qu'elle change le dessin lui-même : un visuel pensé pour
                  deux couleurs de sérigraphie n'est pas celui d'une impression
                  numérique en couleurs. Seules les techniques de votre atelier
                  vous sont proposées. Vous ne savez pas ? Prenez celle qu'il
                  propose en premier, ou demandez-lui.
            - q: "Puis-je retoucher un visuel ?"
              a:
                - >-
                  Oui, %{max_refinements} fois par visuel : une retouche
                  (« enlève le skateboard, ajoute un casque ») ou d'autres
                  versions des mêmes mots. Chacune compte aussi comme une
                  création du jour. Au-delà, un graphiste peut prendre le
                  relais.
            - q: "J'ai déjà mon image, faite ailleurs. Puis-je l'utiliser ?"
              a:
                - >-
                  Oui, avec « Déposer mon visuel » : elle est mise au format de
                  la machine de l'atelier, sans être redessinée. C'est gratuit
                  et ne compte pas dans vos créations du jour.
                - "Elle doit vous appartenir, ou vous devez avoir le droit de l'utiliser : pas de marque, de personnage ni de personne reconnaissable sans accord."
            - q: "Puis-je partir d'un croquis ou d'une photo ?"
              a:
                - "Oui : ajoutez une image de départ à votre description. L'IA la transforme selon ce que vous écrivez."
        - title: "Le fichier et l'impression"
          questions:
            - q: "Puis-je télécharger mon visuel ?"
              a:
                - >-
                  Vous téléchargez un aperçu filigrané. Le fichier d'impression,
                  lui, part directement à l'atelier au format de sa machine : il
                  n'est jamais remis au client.
            - q: "Pourquoi le visuel prêt à imprimer diffère-t-il un peu de l'image générée ?"
              a:
                - >-
                  Pour la sérigraphie, le flex ou la broderie, chaque couleur
                  est un écran, une découpe ou un fil : l'image est redessinée
                  en aplats, les nuances proches sont fusionnées et le blanc
                  devient souvent la couleur du tissu. Validez toujours l'aperçu
                  du fichier d'impression, pas seulement l'image de départ.
            - q: "Comment envoyer mon visuel à l'atelier ?"
              a:
                - >-
                  Depuis la page du visuel : « Envoyer à un atelier ». Indiquez
                  le textile, l'emplacement, les tailles et les quantités.
                  L'atelier reçoit la demande par email avec le fichier, la
                  confirme, puis vous envoie son devis.
            - q: "Combien coûte l'impression ?"
              a:
                - >-
                  Le prix est celui de l'atelier : il vous envoie son devis et
                  vous le réglez directement auprès de lui. Créer et retoucher
                  vos visuels sur %{platform} ne vous coûte rien.
            - q: "Puis-je annuler une demande ?"
              a:
                - "Oui, depuis « Mes demandes », tant que l'atelier ne vous a pas envoyé de devis."
            - q: "L'atelier ne répond pas, que se passe-t-il ?"
              a:
                - >-
                  Il est relancé au bout de %{reminder_hours} heures. Sans
                  réponse après %{expire_days} jours, la demande est close et
                  vous pouvez l'envoyer ailleurs.
        - title: "Faire vérifier par un graphiste"
          questions:
            - q: "À quoi sert la vérification ?"
              a:
                - >-
                  Un graphiste reprend votre visuel pour qu'il s'imprime au
                  mieux : couleurs, détails trop fins, texte. Vous lui dites ce
                  qui doit changer et ce qui doit rester. C'est facultatif et
                  payant ; le prix est affiché avant de commander. Si aucun
                  graphiste ne la prend dans les %{unclaimed_hours} heures, elle
                  est annulée et vous êtes remboursé.
                - >-
                  Votre atelier suit la vérification et reçoit une copie des
                  emails que le site envoie à son sujet : c'est lui qui
                  imprimera le résultat.
            - q: "Quand le graphiste est-il payé ?"
              a:
                - >-
                  Quand vous validez sa version. Sans réponse de votre part,
                  elle est validée d'office au bout de %{auto_accept_days}
                  jours ; vous êtes prévenu avant. Un problème ? Signalez-le
                  depuis la vérification, avant de valider.
        - title: "Vos données"
          questions:
            - q: "Qui voit mes visuels et mes coordonnées ?"
              a:
                - >-
                  Vos visuels ne sont visibles que par vous. L'atelier ne reçoit
                  vos coordonnées que lorsque vous lui envoyez une demande, avec
                  votre accord. Le détail est dans la politique de
                  confidentialité.
            - q: "Comment récupérer ou supprimer mes données ?"
              a:
                - "Dans « Mon compte » : exporter vos données, ou fermer votre compte."
            - q: "Pourquoi mes images portent-elles une mention « générée par IA » ?"
              a:
                - "La loi européenne sur l'IA demande de signaler les images générées. La mention figure sur l'aperçu et dans les données du fichier, pas sur le textile."

    # --- Atelier : /atelier/aide -------------------------------------------------
    workshop:
      title: "Aide"
      heading: "Aide"
      guide_title: "Comment fonctionne %{platform}"
      faq_title: "Questions fréquentes"
      sheet_title: "Expliquer le parcours à vos clients"
      sheet_body: >-
        Votre affiche porte les six étapes et votre QR code. Posez-la sur le
        comptoir, distribuez-la, ou envoyez votre lien par email à un client
        avec qui vous avez échangé.
      sheet_cta: "Mon affiche et mon lien"
      help_for_clients: "Vos clients ont aussi leurs questions fréquentes, à leur indiquer : %{url}"
      steps:
        - title: "Votre fiche dans l'annuaire"
          body:
            - >-
              Remplissez votre fiche : adresse, techniques pratiquées, avec
              pour chacune le nombre de couleurs et les dimensions maximales.
              Ce sont ces limites qui décident des visuels que vous recevez.
            - >-
              Nous relisons la fiche avant de la publier. Elle apparaît dans
              l'annuaire dès qu'elle est publiée et que votre abonnement est
              actif, essai gratuit de %{trial_days} jours compris.
        - title: "Vos clients"
          body:
            - >-
              Votre lien et votre QR code (affiche, flyers, liens nommés) mènent
              à votre page sur %{platform}. Ils admettent aussitôt un client
              qui n'a jamais été le vôtre, une seule fois : un ancien client
              qui les rescanne doit vous redemander.
            - >-
              Un ancien client qui rescanne votre affiche vous adresse une
              demande : vous validez son retour en un clic dans « Mes
              clients ». Vous y voyez aussi par où chaque client est arrivé :
              l'affiche, votre lien, l'email que vous lui avez envoyé, ou l'un
              de vos liens nommés.
            - >-
              Un client qui vous trouve dans l'annuaire n'a pas ce code : il
              vous adresse une demande, que vous acceptez ou refusez dans
              « Mes clients ». Tant que vous n'avez pas accepté, il ne génère
              rien sur votre forfait.
            - >-
              Un client vous est rattaché %{attachment_days} jours. Ils repartent
              quand vous confirmez l'une de ses demandes d'impression, ou quand
              vous cliquez sur « Prolonger » dans « Mes clients ». Sinon, il
              doit vous redemander : un client qui ne fait que générer sans
              jamais vous envoyer de visuel ne consomme pas votre forfait
              indéfiniment.
        - title: "Ce que fait votre client"
          body:
            - >-
              Il choisit l'une de vos techniques, décrit son idée et reçoit
              %{proposals} propositions. Il en garde une, peut la retoucher
              %{max_refinements} fois, ou déposer une image qu'il a déjà. Il
              peut aussi la faire vérifier par un graphiste.
            - "Le visuel est préparé pour vos limites : nombre d'encres, largeur d'impression."
            - >-
              Quand un client fait appel à un graphiste, vérification ou
              création sur mesure, vous la suivez dans « Vérifications » et
              recevez une copie des emails du site. Pendant ce temps, ses
              %{attachment_days} jours sont suspendus ; ils repartent quand le
              graphiste livre.
        - title: "Les demandes d'impression"
          body:
            - >-
              Vous recevez un email avec le fichier d'impression, la fiche
              technique, les tailles et les quantités. Confirmez la réception
              depuis l'email ; le client en est informé.
            - >-
              Le devis et le paiement se font entre vous et le client, hors de
              la plateforme : aucune commission sur vos impressions. Suivez
              ensuite l'avancement dans « Demandes » : devis envoyé, en
              production, terminée.
            - >-
              Sans confirmation, vous êtes relancé à %{reminder_hours} heures ;
              au bout de %{expire_days} jours, la demande est close.
        - title: "Les fichiers que vous recevez"
          body:
            - >-
              Sérigraphie, flex et broderie : un SVG en aplats, couleurs
              comptées une à une, sans fond imprimé. DTF, DTG et sublimation :
              un PNG détouré à 300 dpi à la largeur demandée.
            - >-
              Le client ne reçoit jamais le fichier d'impression, seulement un
              aperçu filigrané à votre nom : il revient chez vous pour
              imprimer.
        - title: "Votre formule"
          body:
            - >-
              Référencement, %{listing_price} HT par mois : votre fiche et
              %{listing_generations} générations par mois pour vos clients.
              Atelier+, %{atelier_plus_price} HT par mois : générations
              illimitées, liens nommés et statistiques.
            - "Chaque client reste limité à %{quota_per_day} créations par jour, quelle que soit votre formule."
      groups:
        - title: "Clients et générations"
          questions:
            - q: "Qu'est-ce qui compte comme une génération ?"
              a:
                - >-
                  Un clic de votre client : une création, une retouche ou une
                  demande d'autres versions, quel que soit le nombre de
                  propositions dessinées. Les essais qui échouent et les images
                  déposées telles quelles ne comptent pas.
            - q: "Que se passe-t-il quand mes générations du mois sont épuisées ?"
              a:
                - >-
                  Vos clients ne peuvent plus lancer de création jusqu'au 1er du
                  mois suivant, et le message leur dit pourquoi. Vous êtes
                  prévenu par email. Atelier+ n'a pas de plafond.
            - q: "Un inconnu peut-il utiliser mon forfait ?"
              a:
                - >-
                  Non. Sans votre lien ou votre QR code, il ne peut que vous
                  demander, et vous décidez. Vous pouvez aussi retirer un
                  client de votre liste à tout moment.
            - q: "Mon lien ou mon affiche a circulé trop loin. Que faire ?"
              a:
                - >-
                  Dans « Mon lien », changez de code. L'ancien lien mène
                  toujours à votre page, mais il faut alors vous demander.
                  Réimprimez votre affiche et vos QR codes.
            - q: "Puis-je envoyer mon lien par email à un client ?"
              a:
                - >-
                  Oui, depuis « Mon lien », à un client avec qui vous avez déjà
                  échangé : c'est un service, pas de la prospection. Le message
                  part de %{platform} à votre nom, et sa réponse vous arrive
                  directement. Une même adresse ne le reçoit qu'une fois de
                  votre part, et le nombre d'envois par jour est limité.
            - q: "Puis-je recommander un graphiste à mes clients ?"
              a:
                - >-
                  Oui, dans « Vérifications » : le graphiste choisi est présenté
                  en premier à vos clients, avec la mention « Recommandé par
                  votre atelier ». Ils restent libres d'en prendre un autre.
            - q: "Comment garder un bon client au-delà de ses 30 jours ?"
              a:
                - >-
                  Confirmez ses demandes d'impression : chaque confirmation
                  relance ses %{attachment_days} jours. Vous pouvez aussi le
                  prolonger vous-même avec « Prolonger » dans « Mes clients ».
            - q: "Un client peut-il envoyer son visuel à un autre atelier ?"
              a:
                - >-
                  Oui, la demande d'impression peut partir vers tout atelier
                  capable de l'imprimer. Les générations, elles, restent
                  comptées sur l'atelier du client au moment de la création.
        - title: "Demandes et fichiers"
          questions:
            - q: "Le fichier reçu ne convient pas à ma machine."
              a:
                - >-
                  Vérifiez d'abord que la technique et les limites de votre
                  fiche sont justes : c'est sur elles que le fichier est
                  préparé. Vous pouvez aussi conseiller au client une
                  vérification par un graphiste. Sinon, écrivez-nous :
                  %{support_email}.
            - q: "Dois-je passer par le site pour le devis ?"
              a:
                - >-
                  Non. Vous chiffrez et vous encaissez comme d'habitude. Le site
                  sert à recevoir un fichier prêt à imprimer et à indiquer au
                  client où en est sa demande.
            - q: "Je ne peux pas faire une demande. Comment la refuser ?"
              a:
                - >-
                  Il n'y a pas de bouton pour refuser : répondez au client, dont
                  les coordonnées sont dans la demande. Tant que vous ne lui avez
                  pas envoyé de devis, il peut l'annuler et l'envoyer à un autre
                  atelier. Une demande jamais confirmée se ferme d'elle-même au
                  bout de %{expire_days} jours.
        - title: "Abonnement"
          questions:
            - q: "Comment changer de formule ou résilier ?"
              a:
                - >-
                  Depuis « Abonnement » : changement de formule, résiliation,
                  carte et factures se gèrent dans l'espace de paiement
                  sécurisé.
            - q: "Que se passe-t-il si un paiement échoue ?"
              a:
                - >-
                  Votre fiche reste visible %{grace_days} jours, le temps de
                  mettre votre carte à jour ; elle est ensuite masquée de
                  l'annuaire jusqu'au paiement.

    # --- Graphiste : /studio/aide -------------------------------------------------
    designer:
      title: "Aide"
      heading: "Aide"
      guide_title: "Travailler sur %{platform}"
      faq_title: "Questions fréquentes"
      steps:
        - title: "Votre profil"
          body:
            - >-
              Présentez-vous, montrez votre portfolio et cochez les niveaux que
              vous acceptez. Nous relisons chaque profil avant de l'activer.
            - >-
              Pour recevoir des missions, il vous faut aussi vos versements :
              « Mes paiements », puis l'inscription sécurisée de Stripe. Tant
              qu'ils ne sont pas activés, aucune mission ne vous est proposée.
        - title: "Prendre une mission"
          body:
            - >-
              Un client paie une vérification, puis la mission vous est
              proposée par email et dans « Vérifications ». Choisi nommément, vous
              avez %{claim_hours} heures pour la prendre avant que le client
              puisse en choisir un autre ; une mission que personne ne prend en
              %{unclaimed_hours} heures est annulée et remboursée au client.
            - >-
              La demande du client tient en quatre points : ce qui change
              (toujours rempli), ce qui reste, le texte exact, les couleurs.
              Vous cochez chacun à la livraison.
        - title: "Livrer"
          body:
            - >-
              Déposez une version au format attendu par l'atelier : un SVG en
              aplats pour la sérigraphie, le flex ou la broderie, contrôlé à
              l'envoi ; un PNG à la bonne définition pour le DTF, le DTG ou la
              sublimation. Le nombre de retours inclus dépend du niveau.
            - >-
              L'atelier pour lequel le visuel a été créé suit la mission et
              reçoit une copie des emails que le site envoie à son sujet.
        - title: "Être payé"
          body:
            - >-
              Le client paie à la commande ; l'argent attend sur la plateforme
              et vous est versé quand il valide votre version. Sans réponse de
              sa part, la version est validée d'office au bout de
              %{auto_accept_days} jours — il est prévenu %{reminder_days} jours
              avant.
            - >-
              Vous recevez le prix de la mission moins la commission de la
              plateforme (%{fee_percent} %). Les factures sont établies par la
              plateforme en votre nom (auto-facturation sous mandat).
        - title: "Si la mission ne convient pas"
          body:
            - >-
              Le visuel ne peut pas être repris tel quel, ou le niveau choisi
              ne correspond pas au travail demandé ? Renvoyez la demande au
              client avec votre motif. S'il s'agit du niveau, joignez une
              proposition : il a %{proposal_hours} heures pour l'accepter,
              sinon il est remboursé.
        - title: "Création sur mesure"
          body:
            - >-
              Pour le sur-mesure, le site ne fait que la mise en relation : en
              prenant la demande, vous recevez les coordonnées du client par
              email, vous chiffrez et vous vous réglez directement entre vous,
              sans commission. Vous clôturez la demande ici une fois le travail
              terminé.
      groups:
        - title: "Paiement"
          questions:
            - q: "Quand suis-je payé ?"
              a:
                - >-
                  Quand le client valide votre version, ou au bout de
                  %{auto_accept_days} jours sans réponse de sa part. Le virement
                  part alors vers votre compte Stripe.
            - q: "Pourquoi ne reçois-je aucune mission ?"
              a:
                - >-
                  Vérifiez trois choses : votre profil est activé, vos versements
                  sont activés dans « Mes paiements », et vous acceptez des missions
                  dans votre profil. Les missions ne vont qu'aux niveaux que vous
                  avez cochés.
            - q: "Et le sur-mesure, combien prend la plateforme ?"
              a:
                - "Rien : vous chiffrez et encaissez directement auprès du client."
        - title: "Litiges"
          questions:
            - q: "Le client signale ma livraison. Que se passe-t-il ?"
              a:
                - >-
                  La validation automatique s'arrête, et vous êtes prévenu avec
                  son motif et son explication. Vous pouvez lui proposer une
                  correction gratuite, qu'il accepte ; il peut aussi retirer son
                  signalement. Un client ne peut signaler qu'une fois par
                  vérification.
            - q: "Et si nous ne trouvons pas d'accord ?"
              a:
                - >-
                  L'administration tranche : soit la vérification est annulée et
                  le client remboursé, soit le remboursement est partagé et vous
                  êtes payé pour le reste. Au-delà de %{dispute_alert_count}
                  litiges perdus en %{dispute_alert_days} jours, votre profil
                  est examiné.
        - title: "Le travail"
          questions:
            - q: "Un atelier peut-il me recommander ?"
              a:
                - >-
                  Oui : chaque atelier peut choisir un graphiste recommandé.
                  Vous êtes alors présenté en premier à ses clients quand ils
                  demandent une vérification — à condition d'accepter des
                  missions et d'avoir vos versements activés.
            - q: "Pourquoi l'atelier est-il en copie ?"
              a:
                - >-
                  C'est lui qui imprimera le visuel. Il suit l'avancement et
                  reçoit une copie des emails du site à propos de la mission.
                  Le client en est informé à la commande.
            - q: "Puis-je rendre un PNG pour un visuel de sérigraphie ?"
              a:
                - >-
                  Non : la version doit être au format que la machine de
                  l'atelier attend. Un SVG est contrôlé à l'envoi (couleurs,
                  éléments interdits) ; un PNG l'est en type, en dimensions et
                  en résolution.


# Tout texte visible de l'application vit ici. Aucune chaîne française ne doit
# apparaître dans une vue, un modèle, un mailer ou un contrôleur.
#
# La gem rails-i18n ne fait pas partie de la stack retenue : les traductions du
# socle Rails (dates, nombres, erreurs de validation) sont donc écrites ici.

fr:
  # --- Socle Rails -----------------------------------------------------------
  date:
    formats:
      default: "%d/%m/%Y"
      short: "%-d %b"
      long: "%-d %B %Y"
    day_names: [dimanche, lundi, mardi, mercredi, jeudi, vendredi, samedi]
    abbr_day_names: [dim, lun, mar, mer, jeu, ven, sam]
    month_names: [~, janvier, février, mars, avril, mai, juin, juillet, août, septembre, octobre, novembre, décembre]
    abbr_month_names: [~, janv., févr., mars, avr., mai, juin, juil., août, sept., oct., nov., déc.]
    order: [day, month, year]

  time:
    formats:
      default: "%d/%m/%Y à %H:%M"
      short: "%-d %b, %H:%M"
      long: "%A %-d %B %Y à %H:%M"
    am: "du matin"
    pm: "de l'après-midi"

  support:
    array:
      words_connector: ", "
      two_words_connector: " et "
      last_word_connector: " et "

  number:
    format:
      separator: ","
      delimiter: " "
      precision: 2
      significant: false
      strip_insignificant_zeros: false
    currency:
      format:
        format: "%n %u"
        unit: "€"
        separator: ","
        delimiter: " "
        precision: 2
    human:
      format:
        delimiter: " "
        precision: 3
        significant: true
        strip_insignificant_zeros: true
      storage_units:
        format: "%n %u"
        units:
          byte:
            one: "octet"
            other: "octets"
          kb: "ko"
          mb: "Mo"
          gb: "Go"
          tb: "To"

  datetime:
    distance_in_words:
      half_a_minute: "trente secondes"
      less_than_x_seconds:
        one: "moins d'une seconde"
        other: "moins de %{count} secondes"
      x_seconds:
        one: "une seconde"
        other: "%{count} secondes"
      less_than_x_minutes:
        one: "moins d'une minute"
        other: "moins de %{count} minutes"
      x_minutes:
        one: "une minute"
        other: "%{count} minutes"
      about_x_hours:
        one: "environ une heure"
        other: "environ %{count} heures"
      x_days:
        one: "un jour"
        other: "%{count} jours"
      about_x_months:
        one: "environ un mois"
        other: "environ %{count} mois"
      x_months:
        one: "un mois"
        other: "%{count} mois"
      about_x_years:
        one: "environ un an"
        other: "environ %{count} ans"
      over_x_years:
        one: "plus d'un an"
        other: "plus de %{count} ans"
      almost_x_years:
        one: "presque un an"
        other: "presque %{count} ans"

  errors:
    format: "%{attribute} %{message}"
    messages:
      blank: "doit être renseigné"
      present: "doit être vide"
      confirmation: "ne correspond pas à %{attribute}"
      invalid: "n'est pas valide"
      taken: "est déjà utilisé"
      accepted: "doit être accepté"
      too_long:
        one: "est trop long (1 caractère maximum)"
        other: "est trop long (%{count} caractères maximum)"
      too_short:
        one: "est trop court (1 caractère minimum)"
        other: "est trop court (%{count} caractères minimum)"
      wrong_length:
        one: "ne fait pas la bonne longueur (1 caractère attendu)"
        other: "ne fait pas la bonne longueur (%{count} caractères attendus)"
      not_a_number: "n'est pas un nombre"
      not_an_integer: "doit être un nombre entier"
      greater_than: "doit être supérieur à %{count}"
      greater_than_or_equal_to: "doit être supérieur ou égal à %{count}"
      less_than: "doit être inférieur à %{count}"
      less_than_or_equal_to: "doit être inférieur ou égal à %{count}"
      equal_to: "doit être égal à %{count}"
      other_than: "doit être différent de %{count}"
      # Produit par `numericality: { in: ... }`. Son absence ne se voyait nulle
      # part jusqu'au jour où une valeur est sortie de l'intervalle : la
      # fabrication du message levait alors I18n::MissingTranslationData, et
      # l'erreur de validation disparaissait derrière elle.
      in: "n'est pas dans l'intervalle autorisé (%{count})"
      inclusion: "n'est pas une valeur autorisée"
      exclusion: "n'est pas disponible"
      required: "doit exister"
      too_many: "en compte trop (%{count} maximum)"
    template:
      header:
        one: "Ce formulaire n'a pas pu être enregistré : une erreur."
        other: "Ce formulaire n'a pas pu être enregistré : %{count} erreurs."
      body: "Vérifiez les champs suivants :"

  helpers:
    submit:
      create: "Créer"
      update: "Enregistrer"
      submit: "Envoyer"


    compatibility:
      technique_not_practised: "ne pratique pas %{technique}"
      # Composé à partir de `ink_ceiling` : l'accord porte sur le plafond, pas
      # sur le nombre d'encres du design, et I18n n'accorde que sur `count`.
      too_many_inks: "%{ceiling}, le design en compte %{count}"

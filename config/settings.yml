# Réglages métier de l'application, lus via Rails.application.config.tshirt
# (voir config/application.rb). Aucune de ces valeurs ne doit être recopiée en
# dur dans le code : on passe toujours par cette configuration.
#
# ⚠ DÉCISION OUVERTE : valeur provisoire, à trancher avant la mise en
#   production. Voir « Décisions ouvertes » dans docs/SPEC.md.
#
# Les secrets (clés d'API, identifiants Stripe) n'ont PAS leur place ici :
# ils vivent dans les credentials Rails ou dans les variables d'environnement.

shared:
  # --- Identité ------------------------------------------------------------
  # Décidé le 21/09/2026. Écrit avec les traits d'union de « prêt-à-porter » :
  # c'est ce rapprochement qui fait le nom, et « tirer » est le mot du métier
  # pour lancer une série. Nom de domaine : pretatirer.fr.
  platform_name: "Prêt-à-tirer"
  # Décidé le 10/10/2026 : sur l'affiche de l'atelier et l'email qu'il envoie
  # à un client, la plateforme est toujours citée par son adresse.
  platform_site: "pretatirer.fr"
  support_email: "contact@pretatirer.fr"

  # --- Génération de designs ----------------------------------------------
  generation:
    # Confirmé par le cahier des charges (« 5 par jour, configurable »).
    quota_per_day: 5
    # Reprises (retouches ou lots de variantes) par lignée de design. Doit
    # valoir MAX_REFINEMENTS du service : Rails tient désormais son propre
    # compte, parce que celui du service s'efface à chaque arrêt de la machine.
    max_refinements: 3
    # Propositions dessinées à chaque clic — création, retouche ou variantes —,
    # chacune avec son parti pris ; le client en garde une. Un clic compte pour
    # une génération et une reprise. Plafonné par PROPOSALS côté service.
    proposals_per_request: 3
    # Bornes imposées par le microservice FastAPI.
    prompt_min_length: 3
    prompt_max_length: 300
    colors_min: 1
    colors_max: 6
    # Appel HTTP : 20 s de délai réseau, sondage toutes les 2 s, 5 min au total.
    http_timeout_seconds: 20
    poll_interval_seconds: 2
    poll_timeout_seconds: 300
    # La taille d'impression est demandée au client pour toutes les techniques,
    # pas seulement les matricielles : un petit logo de poitrine et un grand
    # dessin de dos n'appellent ni le même fichier ni les mêmes ateliers.
    # C'est la largeur préselectionnée, pas une valeur imposée.
    default_print_width_cm: 25
    # Repères proposés au client, en centimètres, dans son vocabulaire à lui.
    # Il peut toujours saisir une autre largeur entre 3 et 60 cm.
    print_size_presets:
      - key: small_logo
        width_cm: 10
      - key: chest
        width_cm: 25
      - key: back
        width_cm: 30
      - key: large_back
        width_cm: 36
    # Nombre de variantes proposées en une fois. Fixé à 3 pour ne surcharger ni
    # l'application ni le serveur de génération.
    variants_per_request: 3

  # --- Revues graphistes ---------------------------------------------------
  reviews:
    # ⚠ DÉCISION OUVERTE : les prix des niveaux sont-ils fixés par la
    #   plateforme (hypothèse retenue) ou par chaque graphiste ?
    prices_set_by: platform
    # Décidé le 06/10/2026 : 15 % de commission sur les vérifications.
    platform_fee_rate: 0.15
    # Délais décidés le 06/10/2026. Le graphiste choisi a 24 h, et non 12 :
    # une nuit ne doit pas suffire à lui faire perdre une mission.
    auto_accept_days: 7
    # Décidé le 08/10/2026 : le client est prévenu 3 jours puis 1 jour avant
    # la validation automatique d'une livraison.
    acceptance_reminder_days: [ 3, 1 ]
    # Décidé le 08/10/2026 : un graphiste avec 2 litiges perdus ou plus
    # (remboursement décidé par l'administration) sur 90 jours est signalé.
    dispute_alert_count: 2
    dispute_alert_days: 90
    proposal_expiry_hours: 72
    proposal_reminder_hours: 24
    designer_claim_timeout_hours: 24
    # Décidé le 09/10/2026 : une vérification qu'aucun graphiste n'a prise
    # dans ce délai est annulée et remboursée en entier.
    unclaimed_refund_hours: 48
    # ⚠ DÉCISION OUVERTE : seuil d'alerte du taux de renvoi sur 30 jours.
    return_rate_alert_threshold: 0.25
    # Décidé le 06/10/2026 : auto-facturation par la plateforme, sous mandat
    # du graphiste — le plus simple pour un micro-entrepreneur.
    self_billing: true

  # --- Demandes d'impression ----------------------------------------------
  print_requests:
    # Décidé le 06/10/2026 : relance à 48 h, expiration à 7 jours — un
    # week-end compris.
    reminder_after_hours: 48
    expire_after_days: 7
    confirmation_token_valid_days: 30
    # ⚠ DÉCISION OUVERTE : gamme de tailles proposée. Celle-ci couvre le
    #   t-shirt adulte courant ; l'enfant et les coupes ajustées restent à
    #   trancher avec les ateliers.
    garment_sizes: [ "XS", "S", "M", "L", "XL", "XXL", "3XL" ]
    # Nombre maximal d'exemplaires pour une taille. Garde-fou de saisie, pas
    # une limite commerciale : le devis se fait hors plateforme.
    max_qty_per_size: 999

  # --- Abonnements imprimeurs ---------------------------------------------
  subscriptions:
    # Les identifiants de prix Stripe viennent de l'environnement
    # (STRIPE_PRICE_LISTING, STRIPE_PRICE_ATELIER_PLUS) : jamais ici.
    # Décidé le 06/10/2026 : 29 € HT par mois pour le Référencement, 59 € HT
    # pour Atelier+, qui l'inclut (59 € en tout, pas 29 + 59). Les montants
    # facturés sont ceux des prix Stripe, TVA ajoutée par le taux
    # STRIPE_TAX_RATE ; ceux-ci ne servent qu'à l'affichage.
    price_listing_cents: 2900
    price_atelier_plus_cents: 5900
    # Générations par mois et par atelier, comptées sur les designs qui le
    # portent. null = illimité. Le quota par client (generation.quota_per_day)
    # s'applique en plus, quelle que soit la formule.
    monthly_generations:
      listing: 100
      atelier_plus: null
    # 30 jours d'essai gratuit à l'inscription.
    trial_period_days: 30
    # Une fiche en past_due reste visible 7 jours, puis elle est masquée.
    past_due_grace_days: 7

  # --- Fichiers ------------------------------------------------------------
  uploads:
    max_svg_bytes: 5242880    # 5 Mo
    max_photo_bytes: 10485760 # 10 Mo
    # Décision tranchée par le cahier des charges : le client télécharge le PNG
    # filigrané issu de l'IA, jamais le SVG vectorisé.
    client_may_download_svg: false
    watermark_enabled: true

  # --- Clients et ateliers -------------------------------------------------
  # Décidé le 09/10/2026 : un client est rattaché à un atelier pour une durée
  # limitée, comptée depuis son admission. Au-delà, il rescanne le lien ou le
  # QR code de l'atelier, ou lui adresse une nouvelle demande.
  clients:
    attachment_days: 30
    # Décidé le 10/10/2026 : un atelier envoie son lien par email à un client
    # déjà démarché, jamais à une liste. Une même adresse ne le reçoit qu'une
    # fois de chaque atelier.
    # ⚠ DÉCISION OUVERTE : plafond d'envois par atelier et par jour. Le compte
    #   Brevo de la plateforme en permet 300 par jour, tous emails confondus.
    link_emails_per_day: 20

  # --- Anti-abus -----------------------------------------------------------
  rate_limits:
    design_creation: { count: 10, within_seconds: 60 }
    authentication: { count: 10, within_seconds: 180 }

  # --- RGPD ----------------------------------------------------------------
  privacy:
    # Version du texte de consentement enregistrée sur chaque demande.
    consent_text_version: "2026-09-v1"
    # ⚠ DÉCISION OUVERTE : durées de conservation.
    design_retention_days: 180
    print_request_anonymize_days: 365
    deleted_account_purge_days: 30
    # ⚠ DÉCISION OUVERTE : durée du cookie qui retient l'atelier d'un visiteur
    #   arrivé par un lien ou un QR code, et durée de mémorisation de son choix.
    #   La CNIL recommande de redemander le consentement au bout de 6 mois au plus.
    attribution_cookie_days: 30
    consent_cookie_months: 6

development:
  support_email: "dev@example.invalid"

test:
  # Valeurs volontairement petites pour que les tests restent lisibles et
  # rapides ; les tests qui portent sur une limite la fixent explicitement.
  generation:
    quota_per_day: 5
    poll_interval_seconds: 0
    poll_timeout_seconds: 10

production: {}
